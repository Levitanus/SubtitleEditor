[package]
name = "subtitle_editor"
version = "0.1.1"
edition = "2021"

[dependencies]
egui = "0.33"
eframe = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
env_logger = "0.11.9"
log = "0.4.29"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
