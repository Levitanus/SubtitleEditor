name: Release from tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}

    steps:
      - name: Compute release metadata
        id: meta
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=Release ${TAG_NAME}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifact (unix)
        id: pkg_unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCH="$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')"
          ASSET_NAME="subtitle_editor-${{ matrix.platform }}-${ARCH}-${{ needs.prepare.outputs.tag_name }}.tar.gz"
          tar -czf "$ASSET_NAME" -C target/release subtitle_editor
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Package release artifact (windows)
        id: pkg_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = "$env:RUNNER_ARCH".ToLower()
          $assetName = "subtitle_editor-windows-$arch-${{ needs.prepare.outputs.tag_name }}.zip"
          Compress-Archive -Path "target/release/subtitle_editor.exe" -DestinationPath $assetName -Force
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: ${{ steps.pkg_unix.outputs.asset_name || steps.pkg_windows.outputs.asset_name }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
