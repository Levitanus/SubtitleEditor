name: Release from tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compute release metadata
        id: meta
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "asset_name=subtitle_editor-linux-x86_64-${TAG_NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifact
        env:
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        run: tar -czf "$ASSET_NAME" -C target/release subtitle_editor

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: Release ${{ steps.meta.outputs.tag_name }}
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.meta.outputs.asset_name }}
